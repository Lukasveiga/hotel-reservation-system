server:
  port: 8072

eureka:
  instance:
    preferIpAddress: true
    lease-renewal-interval-in-seconds: 15
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

api:
  endpoint:
    base-url: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: "*"